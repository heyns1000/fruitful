name: Test Suite

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      # The site has no npm dependencies and no package-lock.json, so `npm ci` cannot run.
      run: npm install --no-audit --no-fund
    
    - name: Run linter
      run: npm run lint
      continue-on-error: true
    
    - name: Run tests
      run: npm test
    # No coverage step: the test script is a placeholder (`echo … && exit 0`) and `npm test -- --coverage`
    # turns it into `exit 0 --coverage`, which fails. Add coverage back with real tests.
